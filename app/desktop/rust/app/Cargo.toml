[package]
name = "vyral-rust"
version = "1.0.0"
authors = ["night"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/syrrnight/VYRAL"
description = "VYRAL desktop music player"

[[bin]]
name = "vyral-rust"
path = "src/main.rs"

[dependencies]
vyral-core = { path = "../core/vyral-core" }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts", "system_fonts", "links", "clipboard", "accesskit", "persistence", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
tiny-skia = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
localzone = "0.3.1"
log = "0.4.34"
memmap2 = "0.9.11"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "json", "socks", "query", "form", "stream"] }
songrec-lib = { version = "0.5.4", default-features = false }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-alac", "symphonia-flac", "symphonia-ogg", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm"] }
rquickjs = "0.14.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.50.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hmac = "0.13.0"
serde_json = "1.0.151"
sys-locale = "0.3.2"
souvlaki = "0.9.3"
tao = "0.38.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
wry = "0.58.2"
rfd = "0.18.0"
tray-icon = "0.27.0"
url = "2.5.8"
# The opt-in renderer: Vulkan on Windows and Linux (renderer.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
mp4ameta = "0.13.0"
md-5 = "0.11"
unicode-normalization = "0.1.26"
# Dolby Digital (Plus) for Atmos streams (dash.rs).
filmcraft-ac3 = "0.9"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "wav", "pcm"] }
rusty-opus = "1.0.2"
unicode-bidi = "0.3"
aes-gcm = "0.11.1"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
qrcode = { version = "0.14.1", default-features = false }
[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, for the Google and Spotify sign-ins.
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }
windows = { version = "0.62.2", features = ["Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire capture can tap the active sink; PulseAudio exposes its monitor sources.
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
# The Secret Service (GNOME Keyring, KWallet) for the sign-ins.
keyring = { version = "4.2.0", features = ["zbus-secret-service-keyring-store"] }
# The tray icon needs GTK running on a thread of its own.
gtk = "0.19"
libc = "0.2"

[build-dependencies]
winresource = "0.1.31"
