<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>nuvx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="/icon/32.png" width="24" height="24" alt="" />
      <span class="name">nuvx</span>
      <span class="version" id="version"></span>
    </header>
    <ul class="group" id="integrations"></ul>
    <a class="site" id="site" target="_blank" rel="noreferrer">Open nuvx web player</a>
    <label class="notice-toggle"><input id="notice-toggle" type="checkbox" checked /> Show discontinuation notice on startup</label>
    <dialog id="discontinuation-notice" aria-labelledby="notice-title">
      <h1 id="notice-title">nuvx is being discontinued</h1>
      <p>nuvx is no longer supported. No further updates will be released by nuvx or licht. VYRAL is maintained by the new project owner and is where to get future updates.</p>
      <a href="https://github.com/syrrnight/VYRAL" target="_blank" rel="noreferrer">Open VYRAL</a>
      <button id="notice-continue" type="button">Continue</button>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
