[package]
name = "nuvx-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "UniFFI bindings that let the Android apps call nuvx-core (Kotlin through JNA)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
nuvx-core = { path = "../nuvx-core" }
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo" # keep symbols: uniffi-bindgen reads its metadata from them; AGP strips the packaged .so
opt-level = "s"
