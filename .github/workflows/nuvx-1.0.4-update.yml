name: Nuvx 1.0.4 in-place update

# Kick off one 1.0.4 update on landing this file on main.
# Re-run manually if another patch build is needed. The existing
# android-nightly.yml signs, tests, packages and publishes the actual release.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nuvx-1.0.4-update.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nuvx-1-0-4-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-signed-update:
    name: Verify upgrade and start signed nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check 1.0.4 version, app identity and removed prompts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'getOrElse("1.0.4")' build.gradle.kts
          grep -Fq 'getOrElse(6)' build.gradle.kts
          grep -Fq 'applicationId = "com.licht.nuvx"' app/android/mobile/build.gradle.kts
          grep -Fq 'MARKETING_VERSION: "1.0.4"' app/ios/mobile/project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "6"' app/ios/mobile/project.yml
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER: com.licht.nuvx' app/ios/mobile/project.yml
          ! grep -Eq 'discordInvitePrompt|discordPromptDismissed' app/android/mobile/src/main/java/com/licht/nuvx/ui/components/NoticeAlert.kt
          ! grep -Eq 'discordInviteJoined|discordPromptDismissed|discordInvite' core/apple/src/UI/RootView.swift
          echo 'Nuvx 1.0.4 upgrade identity and no automatic community pop-ups verified.'
      - name: Dispatch existing signed Nuvx release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-nightly.yml --ref main
          echo 'Nuvx signed release pipeline queued on main.'
