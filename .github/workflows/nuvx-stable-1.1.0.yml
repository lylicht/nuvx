name: Nuvx 1.1.0 stable release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nuvx-stable-1.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nuvx-stable-1-1-0
  cancel-in-progress: false

jobs:
  publish-all-platforms:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: syrrnight/VYRAL
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify 1.1.0 / build 9 release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'getOrElse("1.1.0")' build.gradle.kts
          grep -Fq 'getOrElse(9)' build.gradle.kts
          grep -Fq 'version = "1.1.0"' app/desktop/Cargo.toml
          grep -Fq 'version = "1.1.0"' app/desktop/Cargo.lock
          grep -Fq 'const VERSION_CODE: u64 = 10;' app/desktop/build.rs
          grep -Fq '<string>9</string>' app/desktop/macos/Info.plist
          grep -Fq '#define AppVersion "1.1.0"' app/desktop/windows/nuvx.iss
          grep -Fq '"version": "1.1.0"' app/web/extension/package.json
          grep -Fq 'MARKETING_VERSION: "1.1.0"' app/ios/mobile/project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "9"' app/ios/mobile/project.yml
      - name: Create release draft and run Android, desktop and extension release
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.1.0
          head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$head" == "$GITHUB_SHA" ]]
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0") | .id')
          [[ -z "$releases" ]] || { echo "Release $tag already exists; refusing to replace it" >&2; exit 1; }
          current=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
          [[ -z "$current" ]] || { echo "Tag $tag already exists; refusing to move it" >&2; exit 1; }
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "nuvx 1.1.0" --notes "Final nuvx release. VYRAL is maintained by the new project owner and is where to get future updates: https://github.com/syrrnight/VYRAL"
          gh workflow run android-nightly.yml --ref "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/android-nightly.yml/runs?branch=$tag&per_page=10" --jq '[.workflow_runs[] | select(.event == "workflow_dispatch")][0] | .id // empty')
            [[ -n "$run" ]] && break
            sleep 10
          done
          [[ -n "${run:-}" ]] || { echo "Android release run was not created" >&2; exit 1; }
          while true; do
            status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.status')
            conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
            [[ "$status" == completed ]] && break
            sleep 30
          done
          [[ "$conclusion" == success ]] || { echo "Android, desktop and extension release failed: $conclusion" >&2; exit 1; }
      - name: Run Apple release and attach iOS and macOS packages
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run apple-builds.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/apple-builds.yml/runs?branch=$RELEASE_TAG&per_page=10" --jq '[.workflow_runs[] | select(.event == "workflow_dispatch")][0] | .id // empty')
            [[ -n "$run" ]] && break
            sleep 10
          done
          [[ -n "${run:-}" ]] || { echo "Apple release run was not created" >&2; exit 1; }
          while true; do
            status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.status')
            conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
            [[ "$status" == completed ]] && break
            sleep 30
          done
          [[ "$conclusion" == success ]] || { echo "Apple release failed: $conclusion" >&2; exit 1; }
      - name: Verify every platform package, then publish v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.0 --json assets --jq '.assets[].name' > assets.txt
          for asset in \
            nuvx-setup-1.1.0.exe \
            nuvx-setup-1.1.0-linux-universal.tar.gz \
            nuvx-setup-1.1.0-macos-universal.dmg \
            nuvx-v1.1.0.apk \
            NuvxTV-v1.1.0.apk \
            NuvxAuto-v1.1.0.apk \
            NuvxWear-v1.1.0.apk \
            nuvx-extension-chrome-1.1.0.zip \
            nuvx-extension-firefox-1.1.0.zip \
            nuvx-1.1.0-universal.ipa \
            SHA256SUMS \
            SHA256-ios.txt; do
            grep -Fxq "$asset" assets.txt || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          gh release edit v1.1.0 --draft=false --latest
