name: Rebuild checks

# Format, lint, test and build the Rust rebuild (rebuild/) on Windows and Linux.
on:
  push:
    branches: [main]
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-checks.yml"
  pull_request:
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rebuild
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p nuvx-desktop
