name: Nuvx 1.0.6 stable release dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nuvx-stable-1.0.6.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nuvx-stable-1-0-6
  cancel-in-progress: false

jobs:
  trigger-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify 1.0.6 / build 8 release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'getOrElse("1.0.6")' build.gradle.kts
          grep -Fq 'getOrElse(8)' build.gradle.kts
          grep -Fq 'version = "1.0.6"' app/desktop/Cargo.toml
          grep -Fq 'version = "1.0.6"' app/desktop/Cargo.lock
          grep -Fq 'const VERSION_CODE: u64 = 9;' app/desktop/build.rs
          grep -Fq '<string>8</string>' app/desktop/macos/Info.plist
          grep -Fq '#define AppVersion "1.0.6"' app/desktop/windows/nuvx.iss
          grep -Fq '"version": "1.0.6"' app/web/extension/package.json
          grep -Fq 'MARKETING_VERSION: "1.0.6"' app/ios/mobile/project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "8"' app/ios/mobile/project.yml
          grep -Fq '## 1.0.6' CHANGELOG.md
      - name: Tag current main and dispatch signed release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "main advanced; refusing to tag an outdated commit" >&2
            exit 1
          fi
          # Only repair the known failed, unpublished 1.0.6 tag. Never move a
          # published release, overwrite a draft, or force a non-fast-forward.
          tag=v1.0.6
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.0.6") | .id')
          if [[ -n "$releases" ]]; then
            echo "A release or draft already exists for $tag; refusing to change its tag" >&2
            exit 1
          fi
          active=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$tag&per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id')
          if [[ -n "$active" ]]; then
            echo "Release workflows are already active for $tag; refusing duplicate dispatch" >&2
            exit 1
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            [[ "$current" == be7b40d015acdd6eadf294fae777e014d4e484ab ]] || {
              echo "Unexpected existing $tag commit: $current" >&2
              exit 1
            }
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f "sha=$GITHUB_SHA" -F force=false > /dev/null
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          [[ "$actual" == "$GITHUB_SHA" ]]
          # Tag creation using GITHUB_TOKEN does not trigger on: push workflows.
          # Explicit workflow_dispatch on the tag invokes the stable path instead.
          gh workflow run android-nightly.yml --ref v1.0.6
          gh workflow run apple-builds.yml --ref v1.0.6 -f release_tag=v1.0.6
