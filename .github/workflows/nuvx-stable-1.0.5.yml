name: Nuvx 1.0.5 stable release dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nuvx-stable-1.0.5.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nuvx-stable-1-0-5
  cancel-in-progress: false

jobs:
  trigger-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify 1.0.5 / build 7 release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'getOrElse("1.0.5")' build.gradle.kts
          grep -Fq 'getOrElse(7)' build.gradle.kts
          grep -Fq 'name = "nuvx"' app/desktop/Cargo.toml
          grep -Fq 'version = "1.0.5"' app/desktop/Cargo.toml
          grep -Fq '"version": "1.0.5"' app/web/extension/package.json
          grep -Fq 'MARKETING_VERSION: "1.0.5"' app/ios/mobile/project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "7"' app/ios/mobile/project.yml
          grep -Fq '## 1.0.5' CHANGELOG.md
      - name: Tag current main and dispatch signed release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "main advanced; refusing to tag an outdated commit" >&2
            exit 1
          fi
          # Fail safely rather than moving an existing release tag.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/v1.0.5 -f "sha=$GITHUB_SHA" > /dev/null
          if gh release view v1.0.5 >/dev/null 2>&1; then
            echo "Release v1.0.5 already exists; not dispatching a duplicate"
            exit 0
          fi
          # Tag creation using GITHUB_TOKEN does not trigger on: push workflows.
          # Explicit workflow_dispatch on the tag invokes the stable path instead.
          gh workflow run android-nightly.yml --ref v1.0.5
          gh workflow run apple-builds.yml --ref v1.0.5 -f release_tag=v1.0.5
