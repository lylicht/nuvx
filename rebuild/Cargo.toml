[workspace]
resolver = "3"
members = ["crates/nuvx-ui", "crates/nuvx-playback", "crates/nuvx-audio", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
dioxus = "=0.7.10"
serde = { version = "1", features = ["derive"] }
nuvx-ui = { path = "crates/nuvx-ui" }
nuvx-playback = { path = "crates/nuvx-playback" }
